name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions-rs/cargo@v1
        with:
          command: build
          use-cross: true
          args: --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v2
        with:
          name: convis-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/convis

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v1
      - uses: docker/setup-qemu-action@v1
      - name: OIDC token
        id: docker_oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: "24b78b4d-ffde-4850-a999-76d7bbaf3214"
          expires-in: 1800
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: kentik
          password: ${{ steps.docker_oidc.outputs.token }}
      - uses: actions/download-artifact@v2
        with:
          name: convis-aarch64-unknown-linux-musl
          path: binary/arm64
      - uses: actions/download-artifact@v2
        with:
          name: convis-x86_64-unknown-linux-musl
          path: binary/amd64
      - uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
    needs: build
